<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FrameTrace - Animated walkthrough</title>
<style>
:root{--bg:#eef1f5;--ink:#101a2b;--acc:#0f7f86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111d;--ink:#e5ecf6;--acc:#2fc0c8}}
:root[data-theme="dark"]{--bg:#0a111d;--ink:#e5ecf6;--acc:#2fc0c8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}
.w{width:100%;max-width:1000px}
#st{container-type:inline-size;position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:linear-gradient(160deg,#1b2340 30%,#0f7f86 150%);color:#fff;font-family:system-ui,sans-serif}
.sp{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 28% 100%,#ffffff10 0 3deg,transparent 3deg 9deg)}
.ai{position:absolute;left:1.5%;bottom:0;height:60%;animation:bob 2.4s ease-in-out infinite}
.eye{transform-origin:60px 66px;animation:blink 4s infinite}
.ttl{position:absolute;left:3%;top:3%;font:700 3.2cqw Georgia,serif;text-shadow:.25cqw .25cqw 0 #101a2b}
.art{position:absolute;left:25%;right:3%;top:12%;bottom:27%;font-size:2.2cqw}
.cap{position:absolute;left:3%;right:3%;bottom:3%;background:#fffffff2;color:#101a2b;border:.25cqw solid #101a2b;border-radius:1.2cqw;padding:1.1cqw 1.8cqw;font-size:2cqw;line-height:1.35;box-shadow:.5cqw .5cqw 0 #101a2b;animation:rise .6s both}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}.rise{animation:rise .6s both;animation-delay:var(--d,0s)}
.chips{display:flex;flex-wrap:wrap;gap:1.2cqw}.chip{background:#fff;color:#101a2b;border:.2cqw solid #101a2b;padding:.6cqw 1.4cqw;border-radius:99px;font-weight:700;box-shadow:.3cqw .3cqw 0 #f2b035}
.big{margin-top:2.4cqw;font:700 3.6cqw Georgia,serif;color:#f2b035;text-shadow:.2cqw .2cqw 0 #101a2b}
.flow{display:flex;align-items:center;gap:1.4cqw}.box{background:#fff;color:#101a2b;padding:1.2cqw 1.6cqw;border-radius:1cqw;border:.2cqw solid #101a2b;font-weight:700}.box.hl{background:#2fc0c8}.ar{font-size:3cqw}
.hash{margin-top:2.4cqw;font:1.7cqw ui-monospace,Menlo,monospace}.hash p{margin:.6cqw 0}
.ty{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;width:0;color:#2fc0c8;animation:ty32 2s steps(32) forwards;animation-delay:var(--d)}.ty.l{animation-name:ty64;width:0}
@keyframes ty32{to{width:32ch}}@keyframes ty64{to{width:64ch}}
.hex{position:relative;font:1.6cqw/1.7 ui-monospace,Menlo,monospace;background:#0b1220;padding:1.4cqw;border-radius:1cqw;border:.2cqw solid #2fc0c8;overflow:hidden;color:#8fa0b8}.hex b{color:#f2b035;background:#f2b03522;animation:glow 1s 3 both;animation-delay:var(--d)}
.beam{position:absolute;left:0;right:0;height:.6cqw;background:#2fc0c8;box-shadow:0 0 1.4cqw #2fc0c8;animation:scan 2.4s linear 2}
.badge{margin-top:1.6cqw;display:inline-block;background:#f2b035;color:#101a2b;font-weight:700;padding:.8cqw 1.6cqw;border-radius:1cqw;border:.2cqw solid #101a2b}
.row{display:grid;grid-template-columns:8cqw repeat(24,1fr);gap:.2cqw;margin:.7cqw 0;font-size:1.5cqw;align-items:center}.row i{height:2.6cqw;background:#2fc0c855;border-radius:.3cqw}.row i.r{background:#f2b035}.row i.g{background:repeating-linear-gradient(45deg,#ff6b63 0 .4cqw,transparent .4cqw .8cqw)}
.ch{display:flex;gap:1.2cqw;align-items:center;margin-top:3cqw}.blk{background:#fff;color:#101a2b;border:.2cqw solid #101a2b;border-radius:.8cqw;padding:1cqw 1.2cqw;font:1.5cqw ui-monospace,monospace;text-align:center}.blk.bad{animation:alarm 1.2s 1.5s 3 both}
.rep{background:#fff;color:#101a2b;padding:1.2cqw 2cqw;border-radius:.6cqw;border:.2cqw solid #101a2b;font-weight:700;margin-top:2.4cqw;display:inline-block;rotate:-2deg}
.stk div{background:#fff;color:#101a2b;border-left:1cqw solid #2fc0c8;border-radius:.6cqw;padding:.7cqw 1.6cqw;margin:.7cqw 0;font-weight:600}
.sps{font-size:4cqw;color:#f2b035;animation:tw 1.2s infinite alternate}
.ctl{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}.ctl button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:600 14px system-ui;cursor:pointer}.ctl button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--ink);opacity:.25;cursor:pointer}.dots i.on{opacity:1;background:var(--acc)}
@keyframes bob{50%{transform:translateY(-2%)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes pop{from{transform:scale(0);opacity:0}}@keyframes rise{from{transform:translateY(40%);opacity:0}}
@keyframes scan{from{top:0}to{top:100%}}@keyframes glow{50%{background:#f2b035;color:#101a2b}}@keyframes alarm{50%{background:#ff6b63;color:#fff}}@keyframes tw{from{opacity:.3;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body><div class="w"><div id="st" aria-live="polite"></div>
<div class="ctl"><button onclick="step(-1)">Back</button><button id="pp" onclick="tog()">Pause</button><button onclick="step(1)">Next</button><div class="dots" id="dots"></div></div>
<p style="text-align:center;opacity:.7;margin:8px 0 0;font-size:13px">Tip: screen-record this page (Win+G, or OBS) to save it as a video. Example hashes and demo data are shown for illustration.</p></div>
<script>
const ai=(m)=>`<svg class="ai" viewBox="0 0 120 150" aria-label="Investigator Aiko"><path d="M16 150c0-42 22-54 44-54s44 12 44 54z" fill="#0f7f86" stroke="#101a2b" stroke-width="3"/><path d="M52 98l8 14 8-14z" fill="#fff"/><circle cx="60" cy="62" r="34" fill="#ffe0cc" stroke="#101a2b" stroke-width="3"/><path d="M24 62C18 22 52 12 68 18c24 2 38 22 28 48-6-16-18-26-36-24-16 2-28 8-36 20z" fill="#1b2340" stroke="#101a2b" stroke-width="3"/><path d="M28 40l-14-16 24 8zM88 34l18-12-10 26z" fill="#1b2340"/><g class="eye"><ellipse cx="45" cy="67" rx="9" ry="${m=='shock'?13:10}" fill="#fff" stroke="#101a2b" stroke-width="2"/><ellipse cx="75" cy="67" rx="9" ry="${m=='shock'?13:10}" fill="#fff" stroke="#101a2b" stroke-width="2"/><circle cx="46" cy="68" r="6.5" fill="#2fc0c8"/><circle cx="76" cy="68" r="6.5" fill="#2fc0c8"/><circle cx="46" cy="68" r="3" fill="#101a2b"/><circle cx="76" cy="68" r="3" fill="#101a2b"/><circle cx="48" cy="65" r="2" fill="#fff"/><circle cx="78" cy="65" r="2" fill="#fff"/></g><ellipse cx="34" cy="80" rx="6" ry="3" fill="#ff9aa2" opacity=".6"/><ellipse cx="86" cy="80" rx="6" ry="3" fill="#ff9aa2" opacity=".6"/>${m=='shock'?'<ellipse cx="60" cy="86" rx="4" ry="5" fill="#8a2d3b"/>':'<path d="M52 83q8 8 16 0" fill="none" stroke="#101a2b" stroke-width="2.5" stroke-linecap="round"/>'}</svg>`;
const hx=(a)=>a.map(l=>`<div>${l}</div>`).join('');
const tl=(r)=>`<div class="row"><span>${r}</span>${[...Array(24).keys()].map(h=>`<i class="pop ${h==14?'r':(r=='CH4'&&(h==2||h==3))?'g':''}" style="--d:${h==14?2.2:h*.05}s"></i>`).join('')}</div>`;
const SC=[
['Eight brands, eight formats','shock','Seized CCTV recorders come from many brands, each storing video its own way. Investigators juggle one tool per brand. Not anymore!',()=>`<div class="chips">${['Hikvision','Dahua','CP Plus','Honeywell','Uniview','TP-Link','Godrej','Matrix'].map((b,i)=>`<span class="chip pop" style="--d:${i*.3}s;rotate:${(i*37%17)-8}deg">${b}</span>`).join('')}</div><div class="big pop" style="--d:2.8s">8 brands. 8 formats. 8 tools.</div>`],
['1. Acquire safely','ok','FrameTrace reads the disk image read-only, never writes to it, and computes MD5 and SHA-256 hashes straight away.',()=>`<div class="flow"><b class="box pop">Seized HDD</b><i class="ar pop" style="--d:.5s">&rarr;</i><b class="box pop" style="--d:.8s">Write blocker</b><i class="ar pop" style="--d:1.1s">&rarr;</i><b class="box hl pop" style="--d:1.4s">FrameTrace</b></div><div class="hash"><p class="rise" style="--d:2s">MD5 <span class="ty" style="--d:2.4s">9e107d9d372bb6826bd81d3542a419d6</span></p><p class="rise" style="--d:2.2s">SHA-256 <span class="ty l" style="--d:2.6s">d7a8fbb307d7809469ca9abcb0082e4f8d5651e46d3cdb762d02d0bf37c9e592</span></p></div>`],
['2. Identify the brand','ok','A signature scanner sweeps the raw bytes. Known markers such as DHFS and DHAV reveal the Dahua family. HIKVISION@HANGZHOU reveals Hikvision.',()=>`<div class="hex">${hx(['0000: 4a 2f 9c 11 00 7e b4 d2 3c 88 91 0a f1 22 6d 05','0400: <b style="--d:1.2s">44 48 46 53 34 2e 31</b> 00 00 00 5a c3 19 e0 7b','2000: <b style="--d:2s">44 48 41 56</b> fd 00 00 00 00 00 00 00 00 00 00 00','2040: 00 00 00 01 67 4d 40 1f 96 54 05 01 ed 80 a2 00','2080: 00 00 00 01 65 88 84 00 20 ff fe f6 f0 6e 04 d7'])}<div class="beam"></div></div><span class="badge pop" style="--d:3.2s">Match: Dahua family, 99% (demo image)</span>`],
['3. Recover deleted footage','shock','The index shows all four cameras missing from 14:00 to 15:00. Carving unallocated space brings that hour back, in amber. The red hatching is overwritten and lost for good.',()=>['CH1','CH2','CH3','CH4'].map(tl).join('')+`<div class="chips" style="margin-top:1.4cqw"><span class="chip pop" style="--d:3s">teal = indexed</span><span class="chip pop" style="--d:3.2s;box-shadow:.3cqw .3cqw 0 #f2b035">amber = recovered</span><span class="chip pop" style="--d:3.4s">red = lost</span></div>`],
['4. Fix time, link cameras','ok','The recorder clock ran 7 minutes 42 seconds fast, so FrameTrace corrects it. Events from four cameras then line up into one incident.',()=>`<svg viewBox="0 0 640 280" style="width:100%"><g stroke="#ffffff33">${[50,110,170,230].map(y=>`<line x1="40" x2="620" y1="${y}" y2="${y}"/>`).join('')}</g><g fill="#c4d0e2" font-size="14">${['CH1 Gate','CH2 Lobby','CH3 Parking','CH4 Server'].map((t,i)=>`<text x="40" y="${38+i*60}">${t}</text>`).join('')}</g><polyline points="245,170 277,50 306,110 392,230" fill="none" stroke="#f2b035" stroke-width="3" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" to="0" dur="2s" begin="1s" fill="freeze"/></polyline>${[[245,170],[277,50],[306,110],[392,230]].map((p,i)=>`<circle class="pop" style="--d:${.6+i*.4}s" cx="${p[0]}" cy="${p[1]}" r="9" fill="#2fc0c8" stroke="#fff" stroke-width="3"/>`).join('')}</svg><span class="badge pop" style="--d:3s">Clock fix -7m42s | Incident 14:30 to 14:35</span>`],
['5. Prove nothing was altered','shock','Every action joins a hash-chained custody log. Change one entry and every hash after it breaks, so tampering is caught immediately.',()=>`<div class="ch">${[1,2,3,4,5].map(n=>`<div class="blk pop ${n==3?'bad':''}" style="--d:${n*.3}s">#${n}<br>${['a91f','3c7e','d04b','7be2','19aa'][n-1]}</div>${n<5?'<i class="ar pop" style="--d:'+(n*.3+.15)+'s">&rarr;</i>':''}`).join('')}</div><span class="rep pop" style="--d:2.6s">Printable examination report</span>`],
['How we built it','ok','One self-contained HTML file. Everything runs in the browser, so evidence never leaves the machine and it works offline.',()=>`<div class="stk">${['HTML, CSS and JavaScript in a single file','File API: evidence is read, never written','Web Crypto SHA-256 plus our own MD5','Signature scanner for Hikvision and Dahua families','Hash-chained custody log with a tamper test','Published live and pushed to GitHub'].map((t,i)=>`<div class="pop" style="--d:${i*.5}s">${t}</div>`).join('')}</div>`],
['Live demo time!','ok','One workflow for every brand. Next up: real vendor parsers from lab images and real face and object detection. Thank you!',()=>`<div class="big pop" style="font-size:6cqw;margin:0">FrameTrace</div><p class="rise" style="--d:.8s;font-size:2.6cqw">Acquire. Recover. Correlate. Report.</p><div class="sps">&#10022; &#10022; &#10022;</div>`]
];
let i=0,play=true,tm;const st=document.getElementById('st');
function show(n){i=(n+SC.length)%SC.length;const s=SC[i];st.innerHTML=`<div class="sp"></div>${ai(s[1])}<div class="ttl">${s[0]}</div><div class="art">${s[3]()}</div><div class="cap">${s[2]}</div>`;
document.getElementById('dots').innerHTML=SC.map((_,k)=>`<i class="${k==i?'on':''}" onclick="show(${k});sched()"></i>`).join('');sched()}
function sched(){clearTimeout(tm);if(play)tm=setTimeout(()=>show(i+1),9000)}
function step(d){show(i+d)}function tog(){play=!play;document.getElementById('pp').textContent=play?'Pause':'Play';sched()}
addEventListener('keydown',e=>{if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1);if(e.key==' '){e.preventDefault();tog()}});
show(0);
</script></body></html>
